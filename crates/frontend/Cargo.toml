[package]
name = "frontend"
version = "0.1.0"
edition = "2024"

[dependencies]
gloo-net = "0.7.0"
gloo-timers = { version = "0.4.0", features = ["futures"] }
html-escape = "0.2.15"
js-sys = "0.3.103"
leptos = { version = "0.8.20", features = ["csr"] }
leptos_router = "0.8.15"
pulldown-cmark = "0.13.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
urlencoding = "2.1.3"
wasm-bindgen = "0.2.126"
wasm-bindgen-futures = "0.4.76"
web-sys = { version = "0.3.103", features = ["Headers", "ReadableStream", "ReadableStreamDefaultReader", "Request", "RequestInit", "Response", "Storage", "TextDecoder", "TextDecodeOptions", "Window", "HtmlInputElement", "FileList", "File", "FormData", "Blob", "BlobPropertyBag", "Url", "HtmlAnchorElement"] }

[dev-dependencies]
wasm-bindgen-test = "0.3.76"
# Only the extra DOM query methods the markdown render tests need to
# inspect the mounted view tree (query_selector_all -> NodeList). Scoped to
# dev-dependencies so the production trunk build's feature set is untouched.
web-sys = { version = "0.3.103", features = ["Document", "Element", "HtmlElement", "NodeList"] }
